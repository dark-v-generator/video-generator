language: pt-br
proxies:
  reddit_config:
    type: json
  cover_config:
    title_font_size: 150
  tiktok_publisher_config:
    agent_model: deepseek/deepseek-v4-flash
    cookies_path: .storage/tiktok_cookies.json
    headless: false
    use_vision: false
    max_steps: 60
  # The performance collection (just prod-collect-performance, /collect) reads
  # the TikTok Studio with the publisher's profile. Every key is optional;
  # see docs/configuration.md#tiktok-studio-tiktok_studio_config.
  # tiktok_studio_config:
  #   lookback_days: 30          # days of posts a collection reads by default
  #   max_gap_hours: 12          # slot vs post time for same-caption records
  #   page_timeout_seconds: 60
  #   headless: false
  #   user_data_dir: .storage/tiktok_cookies_userdata   # default: the publisher's
  llm_config:
    type: prompt
    provider_config:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
  history_adaptation_llm_config:
    type: prompt
    provider_config:
      provider: openrouter
      model: moonshotai/kimi-k2.6
      # 'high' chosen by ear (2026-07-29 audio review): tighter, punchier
      # scripts. Tradeoff seen in the shootout: it condenses harder, so
      # drop to 'low' if stories start losing important details.
      # max_tokens bounds runaway runs. It covers the reasoning too: at 12000
      # 'high' sometimes spent it all thinking and returned no story
      # (finish_reason=length, 2026-09-25), so it is 20000.
      reasoning_effort: high
      max_tokens: 20000
  speech_config:
    type: edge-tts
    # Multiplier applied on top of whatever rate the caller asks for, so this is
    # the real narration speed (1.5 = edge-tts "+50%"). Note the speech log line
    # prints the caller's rate, not this one.
    default_rate: 1.5
  transcription_config:
    model: base
    type: local
  # Backgrounds are downloaded once and reused: the daily run pulls from the
  # same pool of clips, so re-downloading them is both the slowest step and
  # what gets this IP throttled (HTTP 429). The whole block is optional — the
  # values below are the defaults, listed here so they are easy to override.
  # youtube_config:
  #   type: pytube
  #   cache:
  #     enabled: true                                 # false = re-download every run
  #     dir: ~/.cache/video-generator/backgrounds     # '~' expanded; created on demand
  #     max_gigabytes: 20                             # cap; least recently used clips go first
services:
  captions_config:
    font_path: default_font.ttf
  video_config:
    # Where the background footage comes from. "youtube" downloads from the
    # channels below through the cache; "local" concatenates the .mp4 files of
    # local_footage_dir and never touches the network.
    # footage_source: youtube
    # local_footage_dir: assets/backgrounds
    # How a story becomes video. "narration-over-footage" (the only strategy
    # today) narrates each part over the footage with cover, captions and CTA.
    # rendering_strategy: narration-over-footage
    call_to_action_path: assets/call_to_action.png
    # How long the cover card stays on screen. It overlays the opening of the
    # story — narration and captions run from the first frame — so this is a
    # display duration, not a lead-in: raising it does not lengthen the video.
    cover_duration: 3
    youtube_channel_url: https://www.youtube.com/@FoodieBoyKR
    youtube_channel_urls:
      - https://www.youtube.com/@FoodieBoyKR
      - https://www.youtube.com/@cookming
      - https://www.youtube.com/@menwiththepot
    youtube_surface: shorts
    youtube_channel_strategy: all
    youtube_pool_size: 100
    # Explicit so the output no longer inherits whatever frame rate the
    # YouTube background happens to have. 60 keeps what prod produced
    # before; 30 halves render time if that ever matters.
    fps: 60
    ffmpeg_params: ["-crf", "23", "-preset", "medium"]
    anti_fingerprint:
      enabled: true
      mirror: true
      zoom: 1.04
      brightness_delta: 0.02
      contrast_delta: 0
      hue_shift_degrees: 0
      speed_delta: 0.02
bots:
  satisfying_bot:
    allowed_user_ids: [627370641]
    low_quality: false
    daily_hour_utc: 9
    daily_minute_utc: 30
    daily_auto_publish_count: 3
    publish_slots_local:
      - "12:00"
      - "18:00"
      - "20:00"
    publish_min_lead_minutes: 30
    publish_hashtags: []
evaluation:
  subreddits:
    - pettyrevenge
    - AmItheAsshole
    - RelationshipAdvice
    - TrueOffMyChest
    - AskReddit
    - ExplainLikeImFive
    - MaliciousCompliance
    - Antiwork
    - EuSouOBabaca
    - RelatosDoReddit
    - relacionamentos
  min_chars: 500
  max_chars: 15000
