language: pt-br
proxies:
  cover_config:
    title_font_size: 150
  llm_config:
    type: mock
  history_adaptation_llm_config:
    type: mock
  reddit_config:
    type: json
  speech_config:
    type: edge-tts
    default_rate: 1.2
  transcription_config:
    model: base
    type: local
services:
  captions_config:
    font_path: default_font.ttf
  video_config:
    # Where the background footage comes from. "youtube" downloads from the
    # channels below through the cache; "local" concatenates the .mp4 files of
    # local_footage_dir and never touches the network.
    # footage_source: youtube
    # local_footage_dir: assets/backgrounds
    # How a story becomes video. "narration-over-footage" (the only strategy
    # today) narrates each part over the footage with cover, captions and CTA.
    # rendering_strategy: narration-over-footage
    call_to_action_path: assets/call_to_action.png
    # Cover holds the screen alone; the story waits for it (adds to duration).
    cover_duration: 0.5
    youtube_channel_url: https://www.youtube.com/@foodieboykr
    youtube_channel_urls:
      - https://www.youtube.com/@foodieboykr
      - https://www.youtube.com/@cookming
      - https://www.youtube.com/@menwiththepot
    youtube_surface: shorts
    youtube_channel_strategy: all
    youtube_pool_size: 100
    # dev renders fast on purpose
    fps: 30
    ffmpeg_params: ["-crf", "28", "-preset", "fast"]
    anti_fingerprint:
      enabled: true
      mirror: true
      zoom: 1.06
      brightness_delta: 0.04
      contrast_delta: 8.0
      hue_shift_degrees: 8.0
      speed_delta: 0.02
bots:
  satisfying_bot:
    allowed_user_ids: [627370641]
    low_quality: false
evaluation:
  subreddits:
    - pettyrevenge
    - AmItheAsshole
    - RelationshipAdvice
    - TrueOffMyChest
    - AskReddit
    - ExplainLikeImFive
    - MaliciousCompliance
    - Antiwork
    - EuSouOBabaca
    - RelatosDoReddit
    - relacionamentos
  min_chars: 500
  max_chars: 15000
